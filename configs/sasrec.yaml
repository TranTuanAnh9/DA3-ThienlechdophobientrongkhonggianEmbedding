# Cấu hình mô hình SASRec — Self-Attentive Sequential Recommendation (Kang & McAuley, ICDM 2018)
# Kiến trúc chuẩn RecBole: Item + Positional Embedding -> Causal Multi-Head Transformer Blocks -> Full-Catalog Dot Product

model_name: sasrec
architecture: SASRec

model_params:
  embedding_size: 64
  n_layers: 2
  n_heads: 2
  inner_size: 256
  hidden_dropout_prob: 0.20
  attn_dropout_prob: 0.20
  hidden_act: gelu
  layer_norm_eps: 1.0e-12
  initializer_range: 0.02

training_overrides:
  learning_rate: 0.001
  weight_decay: 0.0
  train_batch_size: 512
  eval_batch_size: 1024
  epochs: 30
