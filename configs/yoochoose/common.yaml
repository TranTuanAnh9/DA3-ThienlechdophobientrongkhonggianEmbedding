# Cấu hình dùng chung cho cả ba mô hình SBR trên Yoochoose (1/32): GRU4Rec, NARM, SASRec
# Giữ đồng nhất hoàn toàn siêu tham số cốt lõi với Diginetica để so sánh công bằng hai bộ dữ liệu.

project_name: BTL-K03-Popularity-Bias-Embedding-Geometry
dataset: yoochoose

# Hai random seed bắt buộc (giống Diginetica)
seeds:
  - 2024
  - 2025

# Không gian biểu diễn dùng chung (64 chiều, max_seq_length = 50)
embedding_size: 64
max_seq_length: 50
padding_idx: 0

# Dữ liệu đầu vào từ bước notebooks/Yoochoose/02_Xulydulieu.ipynb
data_files:
  processed_dir: data/processed/yoochoose
  item_mapping: item_mapping.csv
  category_mapping: category_mapping.csv
  popularity_groups: popularity_groups.csv
  cold_items: cold_items.csv
  dataset_statistics: dataset_statistics.json
  train_examples: train_examples.parquet
  validation_examples: validation_examples.parquet
  test_examples: test_examples.parquet
  validation_last_item_examples: validation_last_item_examples.parquet
  test_last_item_examples: test_last_item_examples.parquet
  validation_events_full: validation_events_full.parquet
  test_events_full: test_events_full.parquet

# Giao thức Cold-start 20% (Option B) trong lúc huấn luyện và suy diễn
cold_start_protocol:
  keep_cold_in_embedding_table: true
  freeze_cold_item_gradients: true
  mask_cold_items_in_loss: true
  mask_cold_items_in_ranking: true
  mask_fill_value: -1.0e9
  verify_zero_drift_after_training: true

# Cấu hình tối ưu hóa và vòng lặp huấn luyện (đồng nhất với Diginetica)
training:
  loss_type: CE
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0
  grad_clip_norm: 5.0
  train_batch_size: 512
  eval_batch_size: 1024
  epochs: 30
  num_workers: 0
  pin_memory: true
  use_amp: true

# Early Stopping theo Validation Warm MRR@20
early_stopping:
  monitor: mrr@20
  mode: max
  patience: 5
  min_delta: 0.0001

# Đánh giá đầu ra và thiên lệch độ phổ biến
evaluation:
  topk: 20
  candidate_set: warm_only     # 8,326 warm items (candidate_for_main_evaluation == True)
  accuracy_metrics:
    - recall@20
    - mrr@20
    - ndcg@20
  popularity_bias_metrics:
    - coverage@20
    - gini@20
    - arp@20
  evaluate_last_item_split: true
  evaluate_cold_start_impact: true

# Phân tích hình học không gian embedding (File 07 & 08)
embedding_geometry:
  pair_sample_size_per_group: 50000
  bootstrap_iterations: 1000
  final_analysis_bootstrap_iterations: 500
  confidence_level: 0.95
  tsne:
    sample_size: 6000
    perplexity: 30
    n_iter: 1000
    init: pca
    metric: euclidean
    random_seeds:
      - 2024
      - 2025
